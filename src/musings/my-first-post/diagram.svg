<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" role="img">
  <title>Two boxes joined by an arrow, labelled Input and Output</title>
  <rect x="10" y="20" width="100" height="40" fill="none" stroke="#888" stroke-width="2"/>
  <rect x="210" y="20" width="100" height="40" fill="none" stroke="#888" stroke-width="2"/>
  <line x1="110" y1="40" x2="200" y2="40" stroke="#888" stroke-width="2"/>
  <polygon points="210,40 198,34 198,46" fill="#888"/>
  <text x="60" y="45" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#888">Input</text>
  <text x="260" y="45" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#888">Output</text>
</svg>
